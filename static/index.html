<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector | Professional Analysis</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00bcd4;
            --primary-dark: #0097a7;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.8), transparent);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-weight: 300;
            color: var(--text-dim);
            max-width: 600px;
            margin: 0 auto;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            font-weight: 600;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        textarea {
            width: 100%;
            min-height: 250px;
            background-color: rgba(15, 23, 42, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s active;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--text-dim);
            cursor: not-allowed;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 188, 212, 0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-area {
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-label {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            color: var(--text-dim);
        }

        .result-value {
            font-size: 2rem;
            font-weight: 600;
        }

        .result-fake {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .result-real {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Fake News Detector</h1>
        <p class="subtitle">Utilizing machine learning to analyze and verify news article authenticity with precision.</p>
    </header>

    <main>
        <div class="card">
            <div class="input-group">
                <label for="news-text">Article Text</label>
                <textarea id="news-text" placeholder="Paste your news article content here..."></textarea>
            </div>
            <div class="actions">
                <button id="analyze-btn">Analyze Content</button>
            </div>
        </div>

        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>Processing analysis...</p>
        </div>

        <div id="result" class="result-area">
            <div class="result-label">Prediction Result</div>
            <div id="result-text" class="result-value"></div>
        </div>
    </main>

    <footer>
        <p>Built with FastAPI, Scikit-learn, and NLTK.</p>
        <p>&copy; 2025 Fake News Detector</p>
    </footer>

    <script>
        const analyzeBtn = document.getElementById('analyze-btn');
        const newsText = document.getElementById('news-text');
        const loader = document.getElementById('loader');
        const resultArea = document.getElementById('result');
        const resultText = document.getElementById('result-text');

        analyzeBtn.addEventListener('click', async () => {
            const text = newsText.value.trim();
            if (!text) return;

            // UI State
            analyzeBtn.disabled = true;
            resultArea.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text }),
                });

                if (!response.ok) throw new Error('Prediction request failed');
                const data = await response.json();

                resultText.textContent = data.prediction === 'FAKE' ? 'Likely FAKE' : 'Appears REAL';
                
                resultArea.classList.remove('result-fake', 'result-real');
                resultArea.classList.add(data.prediction === 'FAKE' ? 'result-fake' : 'result-real');
                
                loader.style.display = 'none';
                resultArea.style.display = 'block';
                resultArea.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                loader.style.display = 'none';
                alert('An error occurred during analysis. Please try again.');
            } finally {
                analyzeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
